```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f8f8;
            color: #333;
        }

        header {
            background-color: #ff69b4;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .produk-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .produk {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .produk h3 {
            margin-bottom: 10px;
        }

        .harga {
            color: #ff1493;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            background-color: #ff69b4;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff1493;
        }

        .keranjang {
            background-color: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .keranjang h2 {
            margin-bottom: 15px;
        }

        #daftarKeranjang {
            margin-bottom: 15px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #ff1493;
        }
    </style>
</head>

<body>

    <header>
        <h1>Produk Kami</h1>
        <p>Silakan pilih produk yang kamu inginkan 💗</p>
    </header>

    <div class="container">

        <div class="produk-container">

            <div class="produk">
                <h3>Kaos Pink</h3>
                <p class="harga">Rp75.000</p>
                <button onclick="tambahKeranjang('Kaos Pink', 75000)">
                    Tambah ke Keranjang
                </button>
            </div>

            <div class="produk">
                <h3>Tas Mini</h3>
                <p class="harga">Rp100.000</p>
                <button onclick="tambahKeranjang('Tas Mini', 100000)">
                    Tambah ke Keranjang
                </button>
            </div>

            <div class="produk">
                <h3>Sepatu Casual</h3>
                <p class="harga">Rp250.000</p>
                <button onclick="tambahKeranjang('Sepatu Casual', 250000)">
                    Tambah ke Keranjang
                </button>
            </div>

            <div class="produk">
                <h3>Topi Cute</h3>
                <p class="harga">Rp50.000</p>
                <button onclick="tambahKeranjang('Topi Cute', 50000)">
                    Tambah ke Keranjang
                </button>
            </div>

        </div>

        <div class="keranjang">
            <h2>🛒 Keranjang</h2>

            <div id="daftarKeranjang">
                Belum ada produk.
            </div>

            <p class="total">
                Total: Rp<span id="total">0</span>
            </p>
        </div>

    </div>

    <script>
        let totalHarga = 0;

        function tambahKeranjang(namaProduk, hargaProduk) {

            const daftar = document.getElementById("daftarKeranjang");

            if (daftar.innerHTML === "Belum ada produk.") {
                daftar.innerHTML = "";
            }

            const item = document.createElement("p");
            item.textContent = namaProduk + " - Rp" + hargaProduk.toLocaleString("id-ID");

            daftar.appendChild(item);

            totalHarga += hargaProduk;

            document.getElementById("total").textContent =
                totalHarga.toLocaleString("id-ID");
        }
    </script>

</body>
</html>
```
